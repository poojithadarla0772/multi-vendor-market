<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #7C3AED;
            --color-primary-dark: #5B21B6;
            --color-secondary: #FF6B6B;
            --color-bg: #FAF9FF;
            --color-ink: #1A1A2E;
            --color-ink-soft: #6B6B85;
            --color-border: #EAE6FB;
        }
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--color-primary) 0%, #A855F7 50%, var(--color-secondary) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .auth-container {
            background: white;
            padding: 36px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(26,26,46,0.25);
            width: 360px;
        }
        h2 {
            text-align: center;
            color: var(--color-ink);
            margin-bottom: 26px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
        }
        h2::before { content: "🛍️ "; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; color: var(--color-ink-soft); font-size: 14px; font-weight: 500; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--color-border);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
        }
        button {
            width: 100%;
            padding: 13px;
            background-color: var(--color-primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s, transform 0.15s;
        }
        button:hover { background-color: var(--color-primary-dark); transform: translateY(-1px); }
        .toggle-link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: var(--color-primary);
            cursor: pointer;
            font-weight: 600;
        }
        .toggle-link:hover { color: var(--color-primary-dark); }
        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <h2 id="form-title">Account Login</h2>
    
    <form id="auth-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required placeholder="Enter username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="Enter password">
        </div>
        <button type="submit" id="submit-btn">Login</button>
    </form>

    <div class="toggle-link" id="toggle-auth">Don't have an account? Register here</div>
    <div class="message" id="auth-message"></div>
</div>

<script>
    const formTitle = document.getElementById('form-title');
    const submitBtn = document.getElementById('submit-btn');
    const toggleAuth = document.getElementById('toggle-auth');
    const authForm = document.getElementById('auth-form');
    const authMessage = document.getElementById('auth-message');

    let isLoginMode = true;

    // Toggle between Login and Register layouts dynamically
    toggleAuth.addEventListener('click', () => {
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
            formTitle.innerText = "Account Login";
            submitBtn.innerText = "Login";
            toggleAuth.innerText = "Don't have an account? Register here";
        } else {
            formTitle.innerText = "Create Account";
            submitBtn.innerText = "Register";
            toggleAuth.innerText = "Already have an account? Login here";
        }
        authMessage.innerText = "";
    });

    // Handle Form Submission
    authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        // Determine which API endpoint to hit based on mode
        const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';
        
        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            
            const data = await response.json();
            
            if (data.success) {
                authMessage.style.color = "green";
                authMessage.innerText = data.message;
                
                if (isLoginMode) {
                    // 💾 FIXED: Now matches the exact key 'loggedInUser' that app.js searches for
                    localStorage.setItem('loggedInUser', JSON.stringify(data.user));
                    
                    // Redirect to main store home page after 1.5 seconds
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 1500);
                } else {
                    // Switch to login screen after successful registration
                    setTimeout(() => toggleAuth.click(), 1500);
                }
            } else {
                authMessage.style.color = "red";
                authMessage.innerText = data.message;
            }
        } catch (error) {
            authMessage.style.color = "red";
            authMessage.innerText = "Error connecting to server.";
        }
    });
</script>

</body>
</html>
